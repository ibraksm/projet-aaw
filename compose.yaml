services:
  backend:
    build: ./backend
    init: true
    environment:
      NODE_ENV: ${APP_ENV:-development}
      PORT: "3000"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      target: ${APP_ENV:-development}
    init: true
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
